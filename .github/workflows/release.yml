name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify & publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          SESSION_SECRET: ci-dummy-secret-not-used-at-build-time

      - name: Extract release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          {
            echo "tag=$TAG"
            echo "body<<EOF"
            awk -v tag="$TAG" '
              $0 ~ "^#+ .*"tag { found=1; next }
              found && $0 ~ "^#+ " { exit }
              found { print }
              END { if (!found) print "Release "tag }
            ' docs/RELEASE_NOTES.md 2>/dev/null || echo "Release $TAG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
